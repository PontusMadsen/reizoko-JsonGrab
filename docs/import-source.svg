<svg xmlns="http://www.w3.org/2000/svg" width="940" height="650" viewBox="0 0 940 650" role="img" aria-label="JsonGrab source settings: URL, headers, Basic Auth, root path and sample data" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>JsonGrab source settings: URL, headers, Basic Auth, root path and sample data</title>
<rect width="940" height="650" fill="#f7f7fb"/>
<rect x="20.5" y="20.5" width="899" height="609" rx="6" fill="#ffffff" stroke="#dfe0ef"/><text x="40" y="56" font-size="16" fill="#0d0d19" font-weight="600" text-anchor="start">Source</text><text x="40" y="90" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Name</text><rect x="40.5" y="100.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="123" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">Product feed</text><text x="40" y="156" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">JSON URL</text><rect x="40.5" y="166.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="189" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">https://api.example.com/v1/products</text><text x="40" y="222" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">HTTP Header</text><text x="131.6" y="222" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">(optional, e.g. Authorization: Bearer xxxx)</text><rect x="40.5" y="232.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="255" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">Authorization: Bearer xxxx</text><text x="40" y="288" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Use HTTP Basic Auth</text><rect x="40.5" y="298.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="321" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">No</text><path d="M876 312 l5 5 l5 -5" fill="none" stroke="#8f90b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="354" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Basic Auth Username</text><text x="192.4" y="354" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">optional — leave both blank to use system/user/config/reizoko_jsongrab.env.php instead.</text><text x="40" y="371" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">Filling these in is less safe (stored in the database) but saves working in two places.</text><rect x="40.5" y="381.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="404" font-size="14" fill="#8f90b6" font-weight="400" text-anchor="start"></text><text x="40" y="437" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Basic Auth Password</text><text x="192.4" y="437" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">optional</text><rect x="40.5" y="447.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="470" font-size="14" fill="#8f90b6" font-weight="400" text-anchor="start"></text><text x="40" y="503" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Root Path</text><text x="116.39999999999999" y="503" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">Dot path to the list of items in the response, e.g. data.items. Leave blank if the response itself is a JSON</text><text x="40" y="520" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">array — OData-style { "value": [...] } envelopes are detected automatically.</text><rect x="40.5" y="530.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="553" font-size="14" fill="#8f90b6" font-weight="400" text-anchor="start"></text><rect x="40.5" y="582.5" width="139" height="33" rx="4" fill="none" stroke="#dfe0ef"/><text x="110.0" y="604" font-size="13" fill="#5D63F1" font-weight="500" text-anchor="middle">Load Sample Data</text><text x="196" y="603" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">500 item(s) found. Dropdowns below are now filled in from the first one.</text>
</svg>
