<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680" role="img" aria-label="JsonGrab entry settings and matching of existing entries" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>JsonGrab entry settings and matching of existing entries</title>
<rect width="940" height="680" fill="#f7f7fb"/>
<rect x="20.5" y="20.5" width="899" height="395" rx="6" fill="#ffffff" stroke="#dfe0ef"/><text x="40" y="56" font-size="16" fill="#0d0d19" font-weight="600" text-anchor="start">Entry</text><text x="40" y="90" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Channel</text><rect x="40.5" y="100.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="123" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">Products</text><path d="M876 114 l5 5 l5 -5" fill="none" stroke="#8f90b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="156" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Title</text><text x="86.0" y="156" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">Which field from the sample data becomes the entry title</text><rect x="40.5" y="166.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="189" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">name  —  Wireless headphones</text><path d="M876 180 l5 5 l5 -5" fill="none" stroke="#8f90b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="222" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">URL Title</text><text x="116.39999999999999" y="222" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">optional — leave as "auto-generate" to build it from the title</text><rect x="40.5" y="232.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="255" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">— auto-generate from title —</text><path d="M876 246 l5 5 l5 -5" fill="none" stroke="#8f90b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="288" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Status</text><rect x="40.5" y="298.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="321" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">open</text><text x="40" y="354" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Author</text><rect x="40.5" y="364.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="387" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">Pontus</text><path d="M876 378 l5 5 l5 -5" fill="none" stroke="#8f90b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="20.5" y="440.5" width="899" height="219" rx="6" fill="#ffffff" stroke="#dfe0ef"/><text x="40" y="476" font-size="16" fill="#0d0d19" font-weight="600" text-anchor="start">Matching Existing Entries</text><text x="40" y="500" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">To update entries on re-import instead of always creating new ones, match on the entry's title or URL title against a value in the JSON.</text><text x="40" y="532" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Match Field</text><rect x="40.5" y="542.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="565" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">Title</text><path d="M876 556 l5 5 l5 -5" fill="none" stroke="#8f90b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="598" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Match Against</text><rect x="40.5" y="608.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="631" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">sku  —  HP-2210</text><path d="M876 622 l5 5 l5 -5" fill="none" stroke="#8f90b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
