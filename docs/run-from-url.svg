<svg xmlns="http://www.w3.org/2000/svg" width="940" height="260" viewBox="0 0 940 260" role="img" aria-label="JsonGrab cron secret and trigger URL" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>JsonGrab cron secret and trigger URL</title>
<rect width="940" height="260" fill="#f7f7fb"/>
<rect x="20.5" y="20.5" width="899" height="219" rx="6" fill="#ffffff" stroke="#dfe0ef"/><text x="40" y="56" font-size="16" fill="#0d0d19" font-weight="600" text-anchor="start">Run from a URL</text><text x="40" y="80" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">For cron jobs. Set a secret and save, then call the URL shown here. Without a secret, this import can't be triggered by URL.</text><text x="40" y="112" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">Cron Secret</text><text x="131.6" y="112" font-size="12" fill="#8f90b6" font-weight="400" text-anchor="start">a long random string; treat it like a password</text><rect x="40.5" y="122.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="145" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start">k7Qx2mVd9TpLw4RzNc8HsYb3</text><text x="40" y="178" font-size="14" fill="#0d0d19" font-weight="500" text-anchor="start">URL</text><rect x="40.5" y="188.5" width="859" height="35" rx="4" fill="#ffffff" stroke="#dfe0ef"/><text x="52" y="211" font-size="14" fill="#0d0d19" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">https://example.com/index.php?ACT=47&amp;id=1&amp;key=k7Qx2mVd9TpLw4RzNc8HsYb3</text>
